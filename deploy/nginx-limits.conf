# Rate-limit zones. Installed as /etc/nginx/conf.d/search-limits.conf.
#
# These live in their own file because `limit_req_zone` is only valid at http scope,
# not inside a server block — putting them in the site config is a config-test error.
#
# This is a coarse outer guard, not the real limiter. The service does per-token
# budgets weighted by what each endpoint costs (see app/common/ratelimit.py), which is
# the control that matters. nginx's job here is narrower: absorb floods from callers
# with no valid token at all, so unauthenticated traffic never reaches the app.

# 10MB holds roughly 160k addresses.
limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;

# Token administration: a human clicking a form, so a low ceiling costs nothing
# legitimate. Keyed globally rather than per-address so rotating source IPs cannot
# multiply the allowance.
limit_req_zone $server_name zone=admin:1m rate=20r/m;
