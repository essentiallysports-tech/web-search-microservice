[project]
name = "web-search-service"
version = "0.1.0"
description = "Self-hosted web search + extraction microservice"
# The upper bound was a guess that turned out to be wrong: every dependency here
# installs and runs on 3.14. The container still pins 3.12 as the tested target.
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx[http2]>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "redis>=5.2",
  "orjson>=3.10",
  "zstandard>=0.23",
  "trafilatura>=1.12",
  "selectolax>=0.3.21",
  "tenacity>=9.0",
  "structlog>=24.4",
  "prometheus-client>=0.21",
]

[project.optional-dependencies]
# Optional /research layer. There is deliberately no `browser` extra: the
# Chromium-backed tier was removed rather than left optional — see the Dockerfile
# header and app/extract/base.py for why.
llm = ["anthropic>=0.40"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
