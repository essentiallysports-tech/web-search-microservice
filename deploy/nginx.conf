# Load balancer for scaled `api` replicas.
#
# `resolver` + a variable in proxy_pass is the load-bearing detail: with a
# literal upstream, nginx resolves `api` once at startup and pins to whichever
# replica answered first — so scaling up later sends zero traffic to the new
# containers. Forcing per-request resolution against Docker's embedded DNS
# (127.0.0.11) picks up replicas as they come and go.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8000;
    server_name _;

    # Extraction and research legitimately take tens of seconds; the default
    # 60s proxy timeout would cut off a browser-tier request mid-render.
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # The service caps its own request bodies; this is a coarse outer guard.
    client_max_body_size 2m;

    location / {
        set $upstream http://api:8000;
        proxy_pass $upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Preserved end-to-end so a request can be traced across replicas.
        proxy_set_header X-Request-ID      $http_x_request_id;
    }
}
