# Public-facing nginx site, running on the EC2 HOST (not in a container).
#
# Distinct from deploy/nginx.conf, which is an internal load balancer inside the
# Docker network for scaled replicas. This one terminates TLS and is the only thing
# on the box listening publicly.
#
#   internet :443 ──► host nginx (TLS) ──► 127.0.0.1:8000 ──► api container
#
# Install as /etc/nginx/sites-available/search and symlink into sites-enabled.
# Replace SERVICE_HOST everywhere before use — deploy/deploy.sh does that for you.

# Rate limits, defined at http scope via /etc/nginx/conf.d/. See the note in
# bootstrap.sh: these live in a separate file because `limit_req_zone` is not valid
# inside a server block.

server {
    listen 80;
    listen [::]:80;
    server_name SERVICE_HOST;

    # Keep the ACME path on HTTP so certbot can renew without a redirect dance.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name SERVICE_HOST;

    ssl_certificate     /etc/letsencrypt/live/SERVICE_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SERVICE_HOST/privkey.pem;

    # Modern only. Every caller here is a server-side HTTP client we control, so
    # there is no legacy browser to accommodate.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # No ssl_stapling. Let's Encrypt retired OCSP in favour of CRLs, so their
    # certificates carry no responder URL and nginx logs
    #   [warn] "ssl_stapling" ignored, no OCSP responder URL in the certificate
    # on every reload. Do not re-add it for an LE cert; it is dead configuration.

    # 180 days rather than the usual two years: long enough to matter, short enough
    # that a certificate mistake is recoverable. No preload — that is irreversible.
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # This is a JSON API; nothing it returns should ever be framed or rendered.
    add_header X-Frame-Options "DENY" always;

    # Don't advertise the version to scanners.
    server_tokens off;

    access_log /var/log/nginx/search.access.log;
    error_log  /var/log/nginx/search.error.log warn;

    # The service caps its own request bodies (20 URLs, 500-char queries); this is a
    # coarse outer guard against something that never reaches the app.
    client_max_body_size 1m;
    client_body_timeout 15s;

    # ---------------------------------------------------------------- timeouts
    #
    # These MUST exceed the service's own budgets or nginx cuts off work that was
    # about to succeed — and a cancelled request does not un-bill the paid scrape it
    # already dispatched. The relevant service settings:
    #
    #   EXTRACT_DEADLINE_S=25         /search_and_extract and /research
    #   EXTRACT_BATCH_DEADLINE_S=60   /extract, up to 20 URLs in four waves
    #
    # 90s read gives the 60s batch real headroom. Do not lower this to "tidy up"
    # latency; lower the service settings instead, where degradation is graceful.
    proxy_connect_timeout 10s;
    proxy_send_timeout    90s;
    proxy_read_timeout    90s;

    # ------------------------------------------------------------------ routing

    location / {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Preserved end to end so a request can be traced from a caller's logs into
        # the service's. The app generates one if absent.
        proxy_set_header X-Request-ID      $http_x_request_id;

        # Responses are JSON and small; buffering them is fine and keeps slow
        # clients off the app's workers.
        proxy_buffering on;
    }

    # ------------------------------------------------------------------- admin
    #
    # /admin/tokens mints credentials that spend money, so it is the highest-value
    # target on the box. It has to stay internet-reachable because the token UI runs
    # on Vercel, whose egress addresses are not fixed — so IP allow-listing is not
    # available and the static admin key is the real control.
    #
    # What this adds is a brute-force ceiling: 20 requests/minute total. Legitimate
    # use is a human clicking a form a few times an hour, so this is generous for
    # them and useless for an attacker.
    #
    # If you later put the UI behind a fixed egress (NAT gateway, Cloudflare Tunnel,
    # a bastion), replace this with `allow <ip>; deny all;` and drop the rate limit.
    location /admin/ {
        limit_req zone=admin burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------ health
    #
    # Unauthenticated by design so a load balancer can poll them. Kept out of the
    # access log because a 10-second health check otherwise becomes the entire log.
    location = /livez {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }

    # ----------------------------------------------------------------- metrics
    #
    # Prometheus metrics include cost meters and per-caller identities. Not secret,
    # but not public either — it tells an observer exactly how much you spend and
    # which endpoints are live. Loopback and private ranges only; widen to your
    # monitoring host's address if it is elsewhere.
    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }
}
